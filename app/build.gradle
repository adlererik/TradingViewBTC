plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bitcoin.overlay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bitcoin.overlay'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
