<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' wss://ws.bitstamp.net; base-uri 'none'; frame-src 'none'; object-src 'none'">
  <title>TradingViewBTC</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <span class="bitcoin" aria-hidden="true">₿</span>
        <div><h1>BTC<span>/</span>USD</h1><span class="exchange">BITSTAMP</span></div>
      </div>
      <div class="quote"><strong id="price">—</strong><span id="change">—</span></div>
      <button id="refresh" class="icon" type="button" data-label="refresh" data-title="refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.2 6.1M20 6v5h-5"/></svg>
      </button>
    </header>

    <nav class="toolbar" data-label="chartControls">
      <div class="intervals" id="quick-intervals" data-label="commonIntervals">
        <button type="button" data-interval="1h"></button>
        <button type="button" data-interval="4h"></button>
        <button type="button" data-interval="1D" aria-pressed="true"></button>
        <button type="button" data-interval="1W"></button>
        <button type="button" data-interval="1M"></button>
      </div>
      <button id="interval-menu" class="icon menu" type="button" aria-haspopup="dialog" data-label="allIntervals" data-title="allIntervals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <button id="layers" class="with-icon" type="button" aria-haspopup="dialog" data-label="overlaySettings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 8 4-8 4-8-4zm-8 8 8 4 8-4m-16 4 8 4 8-4"/></svg>
        <span data-text="overlays"></span>
      </button>
    </nav>

    <section class="panel" data-label="bitcoinChart">
      <div class="panel-head">
        <div class="script"><span class="script-dot"></span><h2><a href="https://github.com/adlererik/TradingViewBTC" data-title="repoLink">Eriks Super Script</a></h2><span id="active-interval"></span></div>
        <div class="panel-options">
          <div id="mode-badge" hidden></div>
          <button id="auto-scale" type="button" aria-pressed="true" data-text="autoScale"></button>
        </div>
      </div>
      <div id="ohlc" class="ohlc" data-label="candlePrices">
        <span id="selected-time"></span>
        <span data-title="open"><span data-text="openShort"></span> <b id="open">—</b></span>
        <span data-title="high">H <b id="high">—</b></span>
        <span data-title="low">L <b id="low">—</b></span>
        <span data-title="close"><span data-text="closeShort"></span> <b id="close">—</b></span>
      </div>
      <div class="chart" id="chart">
        <canvas id="plot" tabindex="0" data-label="chartInstructions"></canvas>
        <div class="empty" id="empty" role="status">
          <strong id="empty-title"></strong>
          <div id="empty-detail"></div>
          <div class="empty-actions" id="empty-actions" hidden>
            <button id="retry" type="button" data-text="retry"></button><button id="sample" type="button" data-text="viewDemo"></button>
          </div>
        </div>
      </div>
      <div class="panel-foot">
        <div id="ranges" class="ranges" data-label="visibleRange"></div>
        <div class="scale">
          <button id="fit" type="button" aria-pressed="false" data-title="allPlotsTitle" data-text="allPlots"></button>
          <button id="log" type="button" aria-pressed="false" data-title="logTitle" data-text="log"></button>
          <button id="latest" type="button" data-title="latestTitle" data-text="latest"></button>
        </div>
      </div>
    </section>
    <footer class="status">
      <button id="feed-button" type="button" aria-haspopup="dialog" data-title="feedStatus">
        <span id="status-dot" class="status-dot" aria-hidden="true"></span><span id="market-state" aria-live="polite"></span>
      </button>
      <span class="timezone">UTC · USD</span>
      <a id="price-alert" href="/price-alert?lang=en" data-text="priceAlert"></a>
      <button id="help" type="button" aria-haspopup="dialog" data-text="help"></button>
    </footer>
  </main>

  <dialog id="interval-dialog" aria-labelledby="interval-title">
    <div class="dialog-heading"><h2 id="interval-title" data-text="chartInterval"></h2><button class="dismiss" data-label="dismiss">×</button></div>
    <div id="interval-grid" class="interval-grid"></div>
  </dialog>

  <dialog id="layers-dialog" aria-labelledby="overlays-title">
    <div class="dialog-heading"><h2 id="overlays-title" data-text="overlays"></h2><button class="dismiss" data-label="dismiss">×</button></div>
    <div id="layer-list" class="layer-list"></div>
    <div class="layer-settings">
      <label><span data-text="endLabels"></span><input id="end-labels" type="checkbox" checked></label>
      <label><span data-text="projections"></span><input id="projections" type="checkbox" checked></label>
    </div>
  </dialog>

  <dialog id="feed-dialog" aria-labelledby="feed-title">
    <div class="dialog-heading"><h2 id="feed-title" data-text="dataSources"></h2><button class="dismiss" data-label="dismiss">×</button></div>
    <dl id="feed-list"></dl>
    <button class="dialog-action" id="demo-toggle" type="button"></button>
  </dialog>

  <dialog id="help-dialog" aria-labelledby="help-title">
    <div class="dialog-heading">
      <h2 id="help-title" data-text="guideTitle"></h2>
      <button class="dismiss" type="button" data-label="dismiss">×</button>
    </div>
    <label class="language-setting" for="language">
      <span data-text="languageSetting"></span>
      <select id="language">
        <option value="system" data-text="systemLanguage"></option>
        <option value="en" lang="en" data-text="english"></option>
        <option value="sv" lang="sv" data-text="swedish"></option>
      </select>
    </label>
    <article class="guide" id="guide" tabindex="0" aria-labelledby="help-title"></article>
  </dialog>
</body>
</html>
